<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سكربتات</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#0a1f5c,#1e5bff 60%,#4aa3ff);padding:16px}
.wrap{max-width:640px;margin:0 auto;position:relative}
h1{text-align:center;font-size:24px;margin:12px 40px 18px}
h2{font-size:16px;margin:18px 0 8px;opacity:.9}
.card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin-bottom:8px}
textarea,input[type=text],.out{width:100%;background:#0b1a4a;color:#e8f0ff;border:1px solid #3d6bff;border-radius:12px;padding:10px;font-size:14px}
textarea,.out{height:200px;font-family:monospace;direction:ltr;text-align:left}
input[type=text]{margin-bottom:8px}
.out{height:auto;min-height:70px;white-space:pre-wrap;word-break:break-all;margin:0}
.row{display:flex;gap:10px;margin-top:10px}
button{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
.ghost{background:#fff;color:#1146d6}
.main{background:#0a1f5c;color:#fff;width:100%;padding:15px;margin-bottom:14px;border:1px solid #6b96ff}
.copy{background:#4aa3ff;color:#06173f}
#file{display:none}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600}
#pub{display:none;margin-top:10px}
.dots{position:absolute;top:6px;left:0;width:40px;height:40px;flex:none;padding:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px}
.menu{display:none;position:absolute;top:50px;left:0;z-index:5;background:#0a1f5c;border:1px solid #6b96ff;border-radius:12px;min-width:230px;overflow:hidden}
.menu button{display:block;width:100%;background:none;color:#fff;text-align:right;border-radius:0;font-size:15px}
.tag{display:inline-block;background:#4aa3ff;color:#06173f;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
.tag.s{background:#fff;color:#1146d6}.tag.w{background:#ffb84a}
.item h3{margin:8px 0 0;font-size:16px}
.note{font-size:12px;opacity:.8;text-align:center;margin:10px 0}
#conv{display:none}
</style></head><body><div class="wrap">
<button class="dots" onclick="toggleMenu()" aria-label="القائمة">⋮</button>
<div class="menu" id="menu">
  <button onclick="show('hub')">📜 السكربتات</button>
  <button onclick="show('conv')">🔗 تحويل سورس إلى سكربت</button>
</div>

<div id="hub">
  <h1>السكربتات</h1>
  <input type="text" id="q" placeholder="🔎 ابحث باسم الماب أو السكربت">
  <h2>📌 منشورة في موقعنا</h2>
  <div id="own"></div>
  <h2>🌐 من ScriptBlox</h2>
  <div id="ext"></div>
  <div class="row"><button class="copy" id="more" style="display:none" onclick="loadExt(false)">تحميل المزيد</button></div>
  <p class="note">سكربتات ScriptBlox من طرف ثالث وما تمت مراجعتها، استخدمها على مسؤوليتك.</p>
</div>

<div id="conv">
  <h1>تحويل سورس إلى رابط</h1>
  <div class="card">
    <label for="c">الصق السكربت هنا</label>
    <textarea id="c" placeholder="print('Hello')"></textarea>
    <div class="row">
      <button class="ghost" onclick="$('file').click()">📁 رفع ملف</button>
      <input type="file" id="file" accept=".lua,.txt,.luau,text/plain">
    </div>
    <label class="chk"><input type="checkbox" id="pubchk"> نشر السكربت في قائمة السكربتات</label>
    <div id="pub">
      <input type="text" id="title" maxlength="60" placeholder="اسم السكربت">
      <input type="text" id="map" maxlength="60" placeholder="اسم الماب (اللعبة)">
    </div>
  </div>
  <button class="main" id="go" onclick="convert()">🔗 تحويل إلى loadstring</button>
  <div class="card">
    <label>رابط السكربت</label>
    <pre class="out" id="out">سيظهر الرابط هنا بعد التحويل</pre>
    <div class="row"><button class="copy" id="cp" onclick="copyText(result,$('cp'))">📋 نسخ</button></div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let result='',own=[],ext=[],page=1,total=1,timer;
const ls=u=>'loadstring(game:HttpGet("'+u+'"))()';
function toggleMenu(){const m=$('menu');m.style.display=m.style.display==='block'?'none':'block'}
document.addEventListener('click',e=>{if(!e.target.closest('.dots,.menu'))$('menu').style.display='none'});
function show(v){
  $('menu').style.display='none';
  $('hub').style.display=v==='hub'?'block':'none';
  $('conv').style.display=v==='conv'?'block':'none';
}
$('pubchk').addEventListener('change',e=>{$('pub').style.display=e.target.checked?'block':'none'});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{$('c').value=r.result};r.readAsText(f);
});
async function convert(){
  const code=$('c').value;
  if(!code.trim()){$('out').textContent='اكتب أو ارفع سكربت أول';return}
  const b=$('go');b.disabled=true;b.textContent='جاري التحويل...';
  try{
    const r=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code,publish:$('pubchk').checked,title:$('title').value,map:$('map').value})});
    const d=await r.json();
    result=d.error?'':d.loadstring;
    $('out').textContent=d.error||d.loadstring;
    if(!d.error&&$('pubchk').checked)loadOwn();
  }catch(e){$('out').textContent='صار خطأ، جرب مرة ثانية'}
  b.disabled=false;b.textContent='🔗 تحويل إلى loadstring';
}
async function copyText(t,btn){
  if(!t)return;
  try{await navigator.clipboard.writeText(t)}catch(e){
    const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();
  }
  const old=btn.textContent;btn.textContent='✅ تم النسخ';setTimeout(()=>btn.textContent=old,1500);
}
function card(box,tags,title,link){
  const c=document.createElement('div');c.className='card item';
  tags.forEach(([t,cls])=>{const s=document.createElement('span');s.className='tag '+(cls||'');s.textContent=t;c.appendChild(s)});
  const h=document.createElement('h3');h.textContent=title;c.appendChild(h);
  const b=document.createElement('button');b.className='copy';b.textContent='📋 نسخ loadstring';
  b.onclick=()=>copyText(ls(link),b);
  const row=document.createElement('div');row.className='row';row.appendChild(b);c.appendChild(row);
  box.appendChild(c);
}
async function loadOwn(){
  try{own=await (await fetch('/api/list')).json()}catch(e){own=[]}
  renderOwn();
}
function renderOwn(){
  const q=$('q').value.trim().toLowerCase(),box=$('own');box.textContent='';
  const rows=own.filter(i=>(i.map+' '+i.title).toLowerCase().includes(q));
  if(!rows.length){box.textContent='ما في سكربتات منشورة بعد';return}
  rows.forEach(i=>card(box,[[i.map]],i.title,location.origin+'/files/v1/loaders/'+i.id+'.lua'));
}
async function loadExt(reset){
  const box=$('ext'),q=$('q').value.trim();
  if(reset){page=1;ext=[];box.textContent='جاري التحميل...'}else page++;
  try{
    const d=await (await fetch('/api/external?page='+page+'&q='+encodeURIComponent(q))).json();
    if(d.error)throw 0;
    total=d.totalPages;ext=ext.concat(d.items);
  }catch(e){box.textContent='تعذر جلب السكربتات من ScriptBlox الحين';$('more').style.display='none';return}
  box.textContent='';
  if(!ext.length)box.textContent='ما لقيت نتائج';
  ext.forEach(i=>{
    const tags=[[i.game],['ScriptBlox','s']];
    if(i.patched)tags.push(['Patched','w']);
    if(i.key)tags.push(['يحتاج Key','w']);
    card(box,tags,i.title,'https://scriptblox.com/api/script/raw/'+i.id);
  });
  $('more').style.display=page<total?'block':'none';
}
$('q').addEventListener('input',()=>{renderOwn();clearTimeout(timer);timer=setTimeout(()=>loadExt(true),500)});
show('hub');loadOwn();loadExt(true);
</script></body></html>
