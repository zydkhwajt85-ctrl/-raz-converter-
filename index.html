
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAZ CONVERTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;padding:25px 15px}
main{max-width:700px;margin:60px auto}
h1{text-align:center;color:#ef2929;font-size:35px}
p{text-align:center;color:#888}
.card{background:#151515;border:1px solid #292929;padding:20px;border-radius:14px;margin:20px 0}
label{display:block;margin-bottom:12px;font-weight:bold}
textarea{width:100%;height:220px;background:#090909;color:white;border:1px solid #333;border-radius:9px;padding:14px;resize:vertical}
button{background:#c91616;color:white;border:0;border-radius:8px;padding:13px;cursor:pointer;font-weight:bold}
.upload{margin-top:12px}
#file{display:none}
.convert{width:100%;margin-top:18px}
#result{height:90px}
.copy{margin-top:10px;width:100%}
</style>
</head>
<body>
<main>
<h1>RAZ CONVERTER</h1>
<p>LOCAL SCRIPT HOSTING</p>

<div class="card">
<label>كود السكربت</label>
<textarea id="code" placeholder="الصق كود Local هنا..."></textarea>
<label style="margin-top:15px">
<input type="file" id="file" accept=".lua,.txt">
<button onclick="document.getElementById('file').click()">📁 رفع ملف</button>
</label>
</div>

<div class="card">
<button class="convert" onclick="convert()">تحويل</button>
<p id="status"></p>
</div>

<div class="card">
<label>رابط السكربت</label>
<textarea id="result" readonly placeholder="سيظهر الرابط هنا..."></textarea>
<button class="copy" onclick="copyResult()">نسخ الرابط</button>
</div>
</main>

<script>
document.getElementById("file").addEventListener("change",async e=>{
 const f=e.target.files[0];
 if(f) document.getElementById("code").value=await f.text();
});

async function convert(){
 const code=document.getElementById("code").value;
 const status=document.getElementById("status");
 if(!code.trim()){status.textContent="ضع الكود أولاً";return}
 status.textContent="جاري التحويل...";
 try{
  const r=await fetch("/.netlify/functions/script",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({code,name:"RAZ Script"})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.error);
  document.getElementById("result").value=d.url;
  status.textContent="تم إنشاء الرابط";
 }catch(e){status.textContent="تعذر التحويل: "+e.message}
}
async function copyResult(){
 const v=document.getElementById("result").value;
 if(v){await navigator.clipboard.writeText(v);document.getElementById("status").textContent="تم النسخ"}
}
</script>
</body>
</html>
