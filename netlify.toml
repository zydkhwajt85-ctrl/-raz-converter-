l
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/create"
  to = "/.netlify/functions/create"
  status = 200

[[redirects]]
  from = "/files/v1/loaders/:id"
  to = "/.netlify/functions/loader"
  status = 200

[[redirects]]
  from = "/:id/raw"
  to = "/.netlify/functions/loader"
  status = 200
